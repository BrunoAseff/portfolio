name: Verify and deploy portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Hourly: the static site only learns about new public commits by rebuilding.
    - cron: "17 * * * *"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      activity-changed: ${{ steps.activity.outputs.changed }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/github-activity.json
          key: public-activity-${{ github.run_id }}
          restore-keys: public-activity-
      - name: Refresh public activity
        if: github.event_name != 'pull_request'
        run: pnpm exec vp run sync:activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compare activity with production
        id: activity
        if: github.event_name != 'pull_request'
        run: |
          built=$(node -p "require('./src/data/github-activity.json')?.sha ?? ''")
          live=$(curl -fsS https://brunoaseff.com.br/ | grep -o 'commit/[0-9a-f]\{40\}' | head -1 | cut -d/ -f2 || true)
          echo "built=$built live=$live"
          if [ -n "$built" ] && [ "$built" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - run: pnpm exec vp run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-static
          path: dist/
          retention-days: 7
  deploy:
    needs: verify
    # Code changes deploy on push to main; scheduled/manual runs deploy only fresh activity.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.verify.outputs.activity-changed == 'true'))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://brunoaseff.com.br
    concurrency:
      group: cloudflare-portfolio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-static
          path: dist/
      - name: Deploy verified static output
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0b5eb954946b101a17e7c4620ebffb1f
      - name: Verify published output
        run: node scripts/verify-deployment.mjs https://portfolio.brunoaseff2.workers.dev
