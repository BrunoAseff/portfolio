name: Verify portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/github-activity.json
          key: public-activity-${{ github.run_id }}
          restore-keys: public-activity-
      - name: Refresh public activity
        if: github.event_name != 'pull_request'
        run: pnpm exec vp run sync:activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm exec vp run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-static
          path: dist/
          retention-days: 7
